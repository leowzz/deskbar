function topbar(){return `<div class="appbar"><div><div class="identity">${icon('screen')}<span>我的工作台</span></div>${surface==='phone'?`<div class="host" style="margin-top:7px"><i class="dot" ${offline?'style="background:#a4a49a"':''}></i>家里的 Mac · ${offline?'离线':'已连接'}</div>`:''}</div><div class="top-actions">${surface!=='phone'?`<button class="quiet host" data-info="连接详情" aria-label="连接详情"><i class="dot" ${offline?'style="background:#a4a49a"':''}></i>家里的 Mac · ${offline?'离线':'已连接'}</button>`:''}<button class="quiet" data-info="调整工作台" aria-label="调整工作台">${icon('sliders')}</button><button class="quiet" data-info="全屏显示" aria-label="全屏显示">${icon('expand')}</button></div></div>${offline?'<div class="offline-note">电脑暂时离线 · 保留上次数据，恢复连接后才能打开内容。</div>':''}`}
function workbenchA(){return `${topbar()}<div class="a-body"><section class="a-main"><p class="a-summary"><i class="dot"></i><b>2 个会话正在进行</b><span>·</span>最近更新的任务</p><div class="a-sessions">${sessions.slice(0,surface==='phone'?3:6).map(sessionCard).join('')}</div><div class="a-bottom"><span class="page-chip">总览</span><span>单页示意 · 可组合不同组件</span></div></section><aside class="a-side">${quota()}<section><div class="section-head"><h3>常用入口</h3><button class="quiet" data-info="管理入口" aria-label="管理入口">${icon('plus')}</button></div><div class="a-links">${apps.slice(0,4).map(appButton).join('')}</div></section></aside></div>`}
function workbenchB(){return `${topbar()}<div class="b-status"><span><i class="dot"></i> 2 个会话进行中</span><span class="quota-label">周额度 <strong>64%</strong></span><div class="track"><i></i></div><span class="muted">周五重置</span></div><div class="b-body"><section class="b-focus"><span class="focus-caption"><i class="dot"></i> ${offline?'上次进行的任务':'正在进行'} · DeskBar</span><h2>完善设备连接体验</h2><p>Codex · ${offline?'电脑离线，暂时无法打开':'刚刚更新 · 在电脑上继续处理'}</p><button class="primary" data-session="完善设备连接体验" ${offline?'disabled':''}>在电脑上打开 ${icon('arrow')}</button></section><section class="b-recent"><h3>其他会话</h3>${sessions.slice(1,surface==='phone'?4:6).map(s=>`<button class="session" data-session="${s[0]}" ${offline?'disabled':''}><span class="session-title">${s[0]}</span><span class="session-meta"><span>${s[1]} · ${s[2]}</span><span>${s[3]}</span></span></button>`).join('')}</section></div><div class="b-dock"><span class="b-dock-label">常用入口</span><div class="dock-apps">${apps.slice(0,4).map(appButton).join('')}</div><button class="quiet" data-info="管理入口" aria-label="管理入口">${icon('plus')}</button></div>`}
function workbenchC(){return `${topbar()}<div class="c-body"><div class="c-upper"><section><p class="c-greeting">常用的东西，放在手边。</p><div class="c-app-grid">${apps.map(appButton).join('')}</div></section><aside class="c-side">${quota()}${surface!=='phone'?'<p class="small muted" style="margin-top:10px;line-height:1.8">2 个会话进行中<br>点击下方会话，回到电脑。</p>':''}</aside></div><section class="c-task-section"><div class="section-head"><h3>最近在做<span class="count">6 个会话</span></h3><span class="tiny muted">近期更新</span></div><div class="c-list">${sessions.slice(0,surface==='phone'?3:6).map(s=>`<button class="session" data-session="${s[0]}" ${offline?'disabled':''}><i class="dot" ${s[2]!=='进行中'?'style="opacity:.25"':''}></i><span><span class="session-title">${s[0]}</span><span class="project">${s[1]} · ${s[2]}</span></span><small>${s[3]}</small></button>`).join('')}</div></section></div>`}
const toggle=(name,checked=true)=>`<label class="toggle"><input type="checkbox" aria-label="${name}" ${checked?'checked':''}><span></span></label>`;
const sharing=()=>`<div class="setting-row"><div><p>近期会话</p><small>标题、项目和运行状态</small></div>${toggle('共享近期会话')}</div><div class="setting-row"><div><p>账号额度</p><small>剩余额度与重置时间</small></div>${toggle('共享账号额度')}</div><div class="setting-row"><div><p>快捷入口</p><small>在这台电脑上配置的应用与网址</small></div>${toggle('共享快捷入口')}</div><div class="setting-row"><div><p>允许在电脑上打开</p><small>这台设备可以打开已共享的内容</small></div>${toggle('允许在电脑上打开')}</div>`;
const helperFooter=()=>`<div class="helper-footer"><span><i class="dot"></i> 连接助手正在运行</span><span>关闭窗口后继续在菜单栏运行</span></div>`;
function helperA(){return `<div class="helper"><aside class="helper-nav"><div class="identity">${icon('screen')}DeskBar</div><button class="active" data-info="我的设备">我的设备</button><button data-info="共享内容">共享内容</button><button data-info="快捷入口">快捷入口</button><p class="nav-foot">连接助手<br>家里的 Mac</p></aside><section class="helper-main"><div class="helper-title"><div><h2>我的设备</h2><p>为身旁的屏幕选择共享内容。</p></div><button class="primary" data-info="连接新设备">连接设备</button></div><div class="device-banner"><div class="device-glyph">${icon('tablet')}</div><div><h3>小米工作台</h3><p>今天配对 · 同一局域网</p></div><span class="host"><i class="dot"></i>已连接</span></div><section class="settings-block"><h3>向这台设备共享</h3>${sharing()}</section>${helperFooter()}</section></div>`}
function helperB(){return `<div class="helper-b"><header class="helper-b-header"><div class="identity">${icon('screen')}DeskBar <span class="small muted" style="font-weight:400;margin-left:8px">连接助手</span></div><button class="primary" data-info="连接新设备">连接设备</button></header><div class="helper-b-grid"><aside class="helper-b-device"><span class="device-glyph">${icon('tablet')}</span><h3>小米工作台</h3><span class="host"><i class="dot"></i>已连接 · 今天配对</span><button class="quiet" data-info="设备详情">设备详情 ${icon('arrow')}</button></aside><section class="settings-block"><div class="section-head"><h3>共享给这台设备</h3><span class="tiny muted">家里的 Mac</span></div>${sharing()}${helperFooter()}</section></div></div>`}
function helperC(){return `<div class="helper-c"><header class="helper-c-top"><div class="identity">${icon('screen')}DeskBar <span class="small muted" style="font-family:inherit;font-weight:400;margin-left:7px">连接助手</span></div><button class="primary" data-info="连接新设备">连接设备</button></header><div class="helper-c-content"><section><div class="device-banner"><div class="device-glyph">${icon('tablet')}</div><div><h3>小米工作台</h3><p><i class="dot"></i> 已连接 · 今天配对</p></div></div><div class="helper-title"><h2>常用入口</h2><button class="quiet" data-info="添加入口">添加入口 ${icon('plus')}</button></div><div class="c-app-grid">${apps.map(appButton).join('')}</div>${helperFooter()}</section><aside class="helper-c-panel"><h3>这台设备可以使用</h3>${sharing()}</aside></div></div>`}
function paletteStyle(p){return Object.entries(p.tokens).map(([key,value])=>`--${key}:${value}`).join(';')}
function render(){
 document.getElementById('offline-preview').hidden=surface==='helper';document.getElementById('offline-preview').textContent=offline?'恢复在线预览':'预览离线状态';
 document.getElementById('palette-bar').hidden=variant!=='A';
 document.getElementById('palette-options').innerHTML=Object.entries(palettes).map(([key,p])=>`<button class="palette-card" data-palette="${key}" aria-pressed="${palette===key}" style="${paletteStyle(p)}"><span class="palette-card-title"><b>${key}</b>${p.name}<i class="chosen-mark">${palette===key?'✓':''}</i></span><span class="palette-mini"><span class="mini-sidebar"><b>DeskBar</b><i></i><i></i><i></i></span><span class="mini-main"><span class="mini-heading"><b>我的设备</b><i>连接设备</i></span><span class="mini-device"><i></i><span>小米工作台</span><small>已连接</small></span><span class="mini-setting"><span>近期会话</span><i></i></span><span class="mini-setting"><span>账号额度</span><i></i></span></span></span><span class="palette-dots">${p.colors.map(c=>`<i style="background:${c}"></i>`).join('')}<span>${p.tokens['accent'].toUpperCase()}</span></span></button>`).join('');
 document.getElementById('palette-description').textContent=palettes[palette].description;
 const d=directions[variant];document.getElementById('direction-title').innerHTML=`${variant} · ${d.name}${variant==='A'?'<span class="recommend">已选布局</span>':''}`;document.getElementById('direction-desc').textContent=d.desc;document.getElementById('verdict').textContent=d.verdict;
 const html=surface==='helper'?({A:helperA,B:helperB,C:helperC}[variant])():({A:workbenchA,B:workbenchB,C:workbenchC}[variant])();
 document.getElementById('stage').innerHTML=`<article class="preview-app variant-${variant.toLowerCase()} ${surface==='phone'?'phone':''}" data-palette="${palette}" style="${variant==='A'?paletteStyle(palettes[palette]):''}" aria-label="${d.name} · ${surface==='helper'?'电脑连接助手':surface==='phone'?'手机竖屏':'横屏工作台'}">${html}</article>`;
 document.querySelectorAll('[data-variant]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.variant===variant));document.querySelectorAll('[data-surface]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.surface===surface));
 document.getElementById('selected').textContent=selected?`已记下你的偏好：${selected}。可继续切换比较，也可以告诉我想混搭的部分。`:'';
 const url=new URL(location.href);url.searchParams.set('variant',variant);url.searchParams.set('surface',surface);url.searchParams.set('palette',palette);history.replaceState(null,'',url);document.title=`DeskBar · ${variant} ${d.name}`;
}
function notify(message){clearTimeout(toastTimer);const el=document.getElementById('toast');el.textContent=message;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),2800)}
document.querySelector('[data-step="-1"]').innerHTML=icon('left');document.querySelector('[data-step="1"]').innerHTML=icon('right');
function cycle(step){variant=['A','B','C'][(['A','B','C'].indexOf(variant)+step+3)%3];render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.variant){variant=b.dataset.variant;render()}else if(b.dataset.palette){palette=b.dataset.palette;render()}else if(b.dataset.surface){surface=b.dataset.surface;render()}else if(b.dataset.step){cycle(Number(b.dataset.step))}else if(b.id==='pick'){selected=`${variant} · ${directions[variant].name}${variant==='A'?' / '+palettes[palette].name:''}`;render();notify(`已选择 ${selected}。`)}else if(b.hasAttribute('data-offline')){offline=!offline;render();notify(offline?'离线状态示意：保留数据，暂停打开操作。':'恢复在线预览。')}else if(b.dataset.session){document.getElementById('detail-title').textContent=b.dataset.session;document.getElementById('detail-body').textContent='正式界面中，点击会话会在来源电脑的 Codex 中打开。这里仅展示交互和信息层级，不执行真实动作。';document.getElementById('detail').showModal()}else if(b.dataset.open){notify(`示意：将在电脑上打开「${b.dataset.open}」。`)}else if(b.dataset.info){notify(`「${b.dataset.info}」是本方案中的入口位置示意。`)}else if(b.id==='close-detail'){document.getElementById('detail').close()}});
document.addEventListener('change',e=>{if(e.target.matches('.toggle input'))notify(`示例状态：${e.target.getAttribute('aria-label')}${e.target.checked?'已开启':'已关闭'}。真实设置未改变。`)});
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,[contenteditable]')||document.getElementById('detail').open)return;if(e.key==='ArrowLeft'||e.key==='ArrowRight'){e.preventDefault();cycle(e.key==='ArrowLeft'?-1:1)}});
render();
</script>
</body>
</html>
