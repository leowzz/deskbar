 .study-title { gap: 10px; }
 .study-title h1 { font-size: 16px; padding-left: 12px; }
 .prototype-note { font-size: 10px; padding: 6px; }
 .study-intro { font-size: 12px; }
 .toolbar { gap: 12px; padding: 22px 0 18px; }
 .toolbar-right { width: 100%; justify-content: space-between; }
 .segment button { padding: 8px 12px; }
 .detail-navigation { grid-template-columns: repeat(2,minmax(0,1fr)); }
 .palette-tab { padding: 12px; }
 .detail-caption { align-items: flex-start; }
 .token-list { grid-template-columns: repeat(2,minmax(0,1fr)); }
 .study-footer { flex-direction: column; gap: 6px; }
 .detail-stage .desktop-grid, .desktop-grid { grid-template-columns: 1fr; }
 .sidebar, .detail-stage .sidebar { padding: 15px; border-bottom: 1px solid var(--line); border-right: 0; flex-direction: row; align-items: center; justify-content: space-between; gap: 10px; }
 .sidebar-bottom, .nav-item:not(.active) { display: none; }
 .nav-items { margin: 0; display: block; }
 .detail-stage .nav-item { font-size: 12px; padding: 8px; }
 .detail-stage .helper-main, .helper-main { padding: 22px 18px; }
 .detail-stage .page-heading h2 { font-size: 23px; }
 .detail-stage .page-heading p { font-size: 12px; }
 .detail-stage .primary { font-size: 12px; padding: 10px 12px; }
 .detail-stage .device-card { padding: 15px; }
 .detail-stage .device-name { font-size: 14px; }
 .detail-stage .setting-name { font-size: 14px; }
 .detail-stage > .app > .workbench { padding: 20px 16px; }
 .detail-stage > .app .workbench-layout, .workbench-layout { display: flex; flex-direction: column-reverse; gap: 20px; }
 .detail-stage > .app .session { padding: 14px; }
 .detail-stage > .app .session h3 { font-size: 15px; margin: 13px 0 18px; }
 .detail-stage > .app .session-meta { font-size: 11px; }
 .detail-stage > .app .quota-value { font-size: 38px; margin: 14px 0 2px; }
 .detail-stage > .app .shortcut { font-size: 12px; flex-direction: column; padding: 13px 5px; }
 .proposal-footer p { max-width: 230px; }
 .phone-wrap, .detail-stage .phone-wrap { padding: 17px 8px; }
 .state-samples { justify-content: flex-start; gap: 8px; }
 .state-samples p { width: 100%; }
}
@media (prefers-reduced-motion: reduce) { *, *::after { transition: none !important; } }
</style>
</head>
<body>
<main class="shell">
 <header class="study-header">
  <div><div class="study-title"><span class="wordmark">Desklet</span><h1>配色提案</h1></div><p class="study-intro">同一布局，四种气质。选择一套，查看双端完整效果。</p></div>
  <span class="prototype-note">独立原型 · 示例数据</span>
 </header>
 <nav class="toolbar" aria-label="预览方式">
  <div class="segment" aria-label="设备"><button data-surface="helper">电脑连接助手</button><button data-surface="wide">横屏工作台</button><button data-surface="phone">手机竖屏</button></div>
  <div class="toolbar-right"><button class="outline-button" id="offline" aria-pressed="false">离线效果</button><div class="segment" aria-label="比较方式"><button data-mode="compare">四套对比</button><button data-mode="detail">单套细看</button></div></div>
 </nav>
 <div id="gallery" class="gallery"></div>
 <section id="detail" hidden><nav id="palette-navigation" class="detail-navigation" aria-label="配色"></nav><div id="detail-stage" class="detail-stage"></div></section>
 <footer class="study-footer"><div><p>配色尚未定稿，正式 App 未修改。开关与点击仅作示意。</p><p id="selection-note" aria-live="polite">可以点击「单套细看」，标记你喜欢的方案。</p></div><a href="ui-directions.prototype.html">查看上一轮原型 ↗</a></footer>
</main>
<div id="toast" class="toast" role="status"></div>
<dialog id="demo-dialog"><h2 id="dialog-title"></h2><p id="dialog-body"></p><form method="dialog"><button class="pick-button">知道了</button></form></dialog>
<script>
const palettes = {
 silver: { id:'01', name:'铂银', summary:'冷白与石墨灰，少量钢蓝。清晰、利落。', detail:'用明暗与细线建立层次；钢蓝只出现在选中项和额度进度，主按钮保持深灰。', colors:['#f6f7f9','#ffffff','#eef0f3','#22262d','#303e52'] },
 graphite: { id:'02', name:'墨黑', summary:'中性深灰与柔白，低调、专注。', detail:'背景、卡片和侧栏分成三层灰；柔白主按钮留出明确的操作重心，适合常驻副屏。', colors:['#191a1c','#222426','#151618','#eeefef','#d7dce2'] },
 paper: { id:'03', name:'暖纸', summary:'纸色与灰绿，温暖、松弛。', detail:'暖白保留阅读感；灰绿集中在操作和选中项，卡片仍保持接近纸张的颜色。', colors:['#f4f1eb','#fdfbf7','#eae7df','#32382f','#4b6049'] },
 slate: { id:'04', name:'雾蓝', summary:'蓝灰底与浅钢蓝，沉静、有辨识度。', detail:'深蓝灰形成统一底色；浅钢蓝连接按钮、选中态和进度，让深色也有细腻的层次。', colors:['#18212c','#222e3b','#141c26','#e7edf4','#a8bfd9'] }
};
const iconPaths = {
 desk:'<rect x="3" y="4" width="18" height="13" rx="3"/><path d="M8 21h8m-4-4v4M7 8h4v5H7zM14 8h3m-3 4h3"/>',
 devices:'<rect x="3" y="4" width="12" height="13" rx="2"/><path d="M7 21h4m-2-4v4"/><rect x="17" y="8" width="5" height="12" rx="1.5"/>',
 tablet:'<rect x="5" y="2" width="14" height="20" rx="3"/><path d="M10 18h4"/>',
 grid:'<rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/>',
 sliders:'<path d="M4 7h16M4 17h16"/><circle cx="8" cy="7" r="2" fill="var(--canvas)"/><circle cx="16" cy="17" r="2" fill="var(--canvas)"/>',
 plus:'<path d="M12 5v14M5 12h14"/>',
 arrow:'<path d="M5 12h14m-5-5 5 5-5 5"/>',
 expand:'<path d="M8 3H3v5m13-5h5v5M3 16v5h5m13-5v5h-5"/>',
 code:'<path d="m8 7-5 5 5 5m8-10 5 5-5 5m-3-14-2 18"/>',
 globe:'<circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c-5 5-5 13 0 18 5-5 5-13 0-18"/>',
 folder:'<path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10H3z"/>',
 terminal:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="m7 9 3 3-3 3m6 0h4"/>',
 wifi:'<path d="M3 8a15 15 0 0 1 18 0M6 12a10 10 0 0 1 12 0m-9 4a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r=".5"/>',
 battery:'<rect x="2" y="6" width="18" height="12" rx="2"/><path d="M23 10v4M5 9h12v6H5z"/>',
 offline:'<path d="m3 3 18 18M3 8a15 15 0 0 1 3-2m4-1a15 15 0 0 1 11 3M6 12a10 10 0 0 1 5-2m-2 6a5 5 0 0 1 6 0"/>'
};
const icon = name => `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${iconPaths[name] || iconPaths.grid}</svg>`;
const sessions = [
 { title:'完善设备连接体验', project:'Desklet', state:'进行中', kind:'running', time:'刚刚' },
 { title:'整理本周工作记录', project:'笔记', state:'进行中', kind:'running', time:'2 分钟前' },
 { title:'修复长列表滚动', project:'Desklet', state:'已完成', kind:'', time:'18 分钟前' },
 { title:'调整账号用量展示', project:'Desklet', state:'已中断', kind:'interrupted', time:'1 小时前' }
];
const settings = [ ['sessions','近期会话','标题、项目和运行状态'], ['quota','账号额度','剩余额度与重置时间'], ['shortcuts','快捷入口','电脑上配置的应用与网址'], ['open','允许在电脑上打开','可打开已共享的会话与入口'] ];
const sharing = {sessions:true,quota:true,shortcuts:true,open:false};
const params = new URLSearchParams(location.search);
let palette = Object.hasOwn(palettes,params.get('palette')) ? params.get('palette') : 'silver';
let surface = ['helper','wide','phone'].includes(params.get('surface')) ? params.get('surface') : 'helper';
let mode = params.get('mode') === 'detail' ? 'detail' : 'compare';
let offline = params.get('offline') === '1';
let favorite = null;
let toastTimer;
const swatches = p => `<span class="swatches" aria-hidden="true">${p.colors.slice(0,3).concat(p.colors[4]).map(c=>`<i style="background:${c}"></i>`).join('')}</span>`;
const offlineBanner = () => offline ? `<div class="offline-banner">${icon('offline')}<span>电脑暂时离线，保留上次数据。连接恢复后才能打开内容。</span></div>` : '';
function helper() {
 return `<div class="window-bar"><span class="window-dots" aria-hidden="true"><i></i><i></i><i></i></span>Desklet 连接助手</div><div class="desktop-grid">
 <aside class="sidebar"><div class="app-brand">${icon('desk')}Desklet</div><div class="nav-items"><button class="nav-item active" data-demo="我的设备">${icon('devices')}我的设备</button><button class="nav-item" data-demo="快捷入口">${icon('grid')}快捷入口</button><button class="nav-item" data-demo="设置">${icon('sliders')}设置</button></div><div class="sidebar-bottom"><b>家里的 Mac</b>连接助手正在运行</div></aside>
 <section class="helper-main"><header class="page-heading"><div><h2>我的设备</h2><p>为身旁的屏幕选择共享内容</p></div><button class="primary" data-demo="连接设备">${icon('plus')}连接设备</button></header>
 <div class="device-card"><span class="device-icon">${icon('tablet')}</span><div><p class="device-name">小米工作台</p><p class="device-info">${offline?'上次连接于 10:42':'今天配对 · 局域网连接'}</p></div><span class="badge"><i class="dot"></i>${offline?'离线':'已连接'}</span></div>
 <h3 class="subheading">向这台设备共享</h3><div>${settings.map(([id,name,desc])=>`<div class="setting-row"><div><p class="setting-name">${name}</p><p class="setting-desc">${desc}</p></div><label class="switch"><input type="checkbox" data-sharing="${id}" aria-label="${name}" ${sharing[id]?'checked':''}><span class="switch-track"></span></label></div>`).join('')}</div>
 <p class="helper-foot"><i class="dot"></i>关闭窗口后继续在菜单栏运行</p></section></div>`;
}
function workbench() {
 return `${surface==='phone'?`<div class="phone-status"><span>09:41</span><span>${icon('wifi')}${icon('battery')}</span></div>`:''}<div class="workbench">
 <header class="workbench-header"><div class="workbench-identity"><h2>我的工作台</h2><p><i class="dot"></i>家里的 Mac · ${offline?'离线':'已连接'}</p></div><div class="workbench-actions"><button class="icon-button" data-demo="调整工作台" aria-label="调整工作台">${icon('sliders')}</button>${surface==='phone'?'':`<button class="icon-button" data-demo="全屏显示" aria-label="全屏显示">${icon('expand')}</button>`}</div></header>
 ${offlineBanner()}<div class="workbench-layout"><section><header class="section-title"><h3>近期会话</h3><small>${offline?'上次同步的状态':'2 个进行中'}</small></header><div class="session-grid">${sessions.map((s,i)=>`<button class="session" data-session="${i}" ${offline?'disabled':''}><span class="session-state ${s.kind}"><i class="dot"></i>${s.state}</span><h3>${s.title}</h3><span class="session-meta"><span>${s.project} · ${s.time}</span>${icon('arrow')}</span></button>`).join('')}</div></section>
 <aside class="quota"><p class="quota-label">Codex 每周额度</p><p class="quota-value">64<span>%</span></p><p class="quota-caption">${offline?'上次剩余':'剩余可用'}</p><div class="quota-track"><i></i></div><p class="quota-reset">周五 18:00 重置</p></aside></div>
 <section class="shortcut-section"><header class="section-title"><h3>常用入口</h3><small>在电脑上打开</small></header><div class="shortcut-grid">${[['code','Codex'],['globe','浏览器'],['folder','访达'],['terminal','终端']].map(([glyph,name])=>`<button class="shortcut" data-open="${name}" ${offline?'disabled':''}>${icon(glyph)}${name}</button>`).join('')}</div></section>
 <footer class="workbench-footer"><span>总览</span><span class="page-dots" aria-label="当前第 1 页，共 3 页"><i></i><i></i><i></i></span><span>${offline?'上次数据':'刚刚更新'}</span></footer></div>${surface==='phone'?'<div class="home-indicator" aria-hidden="true"></div>':''}`;
}
function preview(key) {
 const content=`<div class="app ${surface==='phone'?'phone':''} ${offline?'offline':''}" data-palette="${key}" aria-label="${palettes[key].name} · ${surface==='helper'?'电脑连接助手':surface==='phone'?'手机工作台':'横屏工作台'}">${surface==='helper'?helper():workbench()}</div>`;
 return surface==='phone'?`<div class="phone-wrap">${content}</div>`:content;
}
function render() {
 document.querySelectorAll('[data-surface]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.surface===surface));
 document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.mode===mode));
 document.getElementById('offline').setAttribute('aria-pressed',offline);
 document.getElementById('offline').textContent=offline?'恢复在线':'离线效果';
 document.getElementById('gallery').hidden=mode!=='compare';
 document.getElementById('detail').hidden=mode!=='detail';
 if(mode==='compare'){
  document.getElementById('gallery').innerHTML=Object.entries(palettes).map(([key,p])=>`<article class="proposal"><header class="proposal-heading"><h2><span>${p.id}</span>${p.name}${favorite===key?' · 已标记':''}</h2><button data-palette="${key}" aria-label="细看${p.name}">细看这套 ${icon('arrow')}</button></header>${preview(key)}<footer class="proposal-footer"><p>${p.summary}</p>${swatches(p)}</footer></article>`).join('');
  document.getElementById('detail-stage').innerHTML='';
 }else{
  document.getElementById('gallery').innerHTML='';
  document.getElementById('palette-navigation').innerHTML=Object.entries(palettes).map(([key,p])=>`<button class="palette-tab" data-palette="${key}" aria-pressed="${key===palette}"><span class="palette-tab-name"><span>${p.id}</span>${p.name}</span>${swatches(p)}</button>`).join('');
  const p=palettes[palette];
  document.getElementById('detail-stage').innerHTML=`${preview(palette)}<div class="detail-caption"><div><h2>${p.id} · ${p.name}</h2><p>${p.detail}</p></div><button class="pick-button" id="pick" aria-pressed="${favorite===palette}">${favorite===palette?'已标记喜欢':'喜欢这套'}</button></div><div class="token-list">${['页面底色','卡片','侧栏','正文','主按钮'].map((label,i)=>`<div class="token"><i style="background:${p.colors[i]}"></i><div>${label}<code>${p.colors[i].toUpperCase()}</code></div></div>`).join('')}</div><div class="app state-samples" data-palette="${palette}"><p>状态配色</p><span class="state-chip success">已连接 / 进行中</span><span class="state-chip warning">离线 / 已中断</span><span class="state-chip danger">打开失败</span><span class="state-chip">已完成</span></div>`;
 }
 document.getElementById('selection-note').textContent=favorite?`本页已标记「${palettes[favorite].id} · ${palettes[favorite].name}」。可直接把编号告诉我；刷新后清除标记。`:'可以点击「单套细看」，标记你喜欢的方案。';
 const url=new URL(location.href);url.searchParams.set('palette',palette);url.searchParams.set('surface',surface);url.searchParams.set('mode',mode);offline?url.searchParams.set('offline','1'):url.searchParams.delete('offline');history.replaceState(null,'',url);
 document.title=`Desklet · ${mode==='compare'?'四套配色对比':palettes[palette].name}`;
}
function notify(text) {clearTimeout(toastTimer);const toast=document.getElementById('toast');toast.textContent=text;toast.classList.add('show');toastTimer=setTimeout(()=>toast.classList.remove('show'),3000);}
function showDemo(title,text) {document.getElementById('dialog-title').textContent=title;document.getElementById('dialog-body').textContent=text;document.getElementById('demo-dialog').showModal();}
document.addEventListener('click',event=>{
 const button=event.target.closest('button');if(!button||button.disabled)return;
 if(button.dataset.surface){surface=button.dataset.surface;render();}
 else if(button.dataset.mode){mode=button.dataset.mode;render();}
 else if(button.dataset.palette){palette=button.dataset.palette;mode='detail';render();document.querySelector(`[data-palette="${palette}"].palette-tab`)?.focus({preventScroll:true});}
 else if(button.id==='offline'){offline=!offline;render();}
 else if(button.id==='pick'){favorite=favorite===palette?null:palette;render();document.getElementById('pick')?.focus({preventScroll:true});notify(favorite?`已在本页标记「${palettes[palette].name}」，尚未应用到 App。`:'已取消标记。');}
 else if(button.dataset.session!==undefined){const s=sessions[Number(button.dataset.session)];showDemo(s.title,'正式 App 中会在来源电脑打开该会话。这里仅展示配色与点击反馈，不发送打开请求。');}
 else if(button.dataset.open){notify(`入口示意：在电脑上打开${button.dataset.open}。本次未执行。`);}
 else if(button.dataset.demo){showDemo(button.dataset.demo,'这里展示该入口的位置与视觉样式。连接、页面编辑和真实设置仍由正式 App 提供。');}
});
document.addEventListener('change',event=>{
 const id=event.target.dataset.sharing;if(!Object.hasOwn(sharing,id))return;
 sharing[id]=event.target.checked;
 document.querySelectorAll(`[data-sharing="${id}"]`).forEach(input=>{input.checked=sharing[id];});
 notify('仅改变原型中的开关，设备权限未修改。');
});
document.addEventListener('keydown',event=>{
 if(mode!=='detail'||document.getElementById('demo-dialog').open||event.target.matches('input,textarea,select,[contenteditable]'))return;
 if(event.key==='ArrowLeft'||event.key==='ArrowRight'){event.preventDefault();const keys=Object.keys(palettes);palette=keys[(keys.indexOf(palette)+(event.key==='ArrowLeft'?-1:1)+keys.length)%keys.length];render();document.querySelector(`[data-palette="${palette}"].palette-tab`)?.focus({preventScroll:true});}
});
render();
</script>
</body>
</html>
