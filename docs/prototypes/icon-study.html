<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <title>DeskBar · 图标候选</title>
    <style>
      :root {
        color-scheme: light;
        --canvas: #f6f7f9;
        --surface: #fff;
        --text: #22262d;
        --muted: #626c7b;
        --line: #e1e5eb;
        --raised: #eef0f3;
        --focus: #527bc2;
        --opposite: #222426;
        --inverse: #eeefef;
      }
      :root[data-theme="dark"] {
        color-scheme: dark;
        --canvas: #191a1c;
        --surface: #222426;
        --text: #eeefef;
        --muted: #a1a6ad;
        --line: #35383d;
        --raised: #2c2e31;
        --focus: #adc6eb;
        --opposite: #f6f7f9;
        --inverse: #22262d;
      }
      * { box-sizing: border-box; }
      body { margin: 0; background: var(--canvas); color: var(--text); font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      main { max-width: 1320px; margin: 0 auto; padding: 52px 40px 30px; }
      header { display: flex; align-items: end; justify-content: space-between; gap: 24px; margin-bottom: 32px; }
      .brand { margin: 0 0 6px; font-size: 16px; font-weight: 650; letter-spacing: -.4px; }
      h1 { margin: 0; font-size: 30px; font-weight: 550; letter-spacing: -.8px; }
      .controls { display: flex; flex-wrap: wrap; gap: 10px; }
      .switch { display: flex; padding: 3px; background: var(--raised); border-radius: 9px; }
      button, a { -webkit-tap-highlight-color: transparent; }
      button { min-height: 36px; padding: 6px 13px; border: 0; border-radius: 6px; background: transparent; color: var(--muted); font: inherit; cursor: pointer; }
      button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px #0000000a; }
      button:focus-visible, a:focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; }
      .grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; }
      article { min-width: 0; padding: 22px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
      .label { display: flex; align-items: baseline; gap: 10px; }
      .number { color: var(--muted); font-size: 13px; font-variant-numeric: tabular-nums; }
      h2 { margin: 0; font-size: 18px; font-weight: 550; }
      .chosen { margin-left: auto; font-size: 12px; color: var(--muted); }
      .stage { display: grid; place-items: center; height: 238px; }
      .hero { display: grid; place-items: center; width: 152px; height: 152px; border-radius: 34px; }
      .hero svg { width: 124px; height: 124px; }
      body[data-mode="app"] .hero { background: var(--opposite); color: var(--inverse); }
      body[data-mode="app"] .hero svg { width: 106px; height: 106px; }
      .description { min-height: 48px; margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.65; }
      .samples { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding-top: 20px; border-top: 1px solid var(--line); }
      .sizes { display: flex; align-items: start; gap: 18px; }
      .size { display: flex; flex-direction: column; align-items: center; gap: 9px; }
      .sample-icon { height: 32px; display: grid; place-items: center; }
      .size span { color: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
      .inverse { display: grid; place-items: center; width: 50px; height: 50px; background: var(--opposite); color: var(--inverse); border-radius: 12px; }
      .inverse svg { width: 34px; height: 34px; }
      .download { display: flex; align-items: center; justify-content: space-between; margin-top: 22px; padding: 8px 0; color: var(--text); font-size: 13px; text-decoration: none; }
      .download:hover { text-decoration: underline; text-underline-offset: 4px; }
      .download svg { width: 16px; height: 16px; }
      footer { margin-top: 24px; display: flex; justify-content: space-between; gap: 18px; color: var(--muted); font-size: 13px; }
      svg { display: block; flex-shrink: 0; }
      @media (max-width: 1100px) {
        main { max-width: 830px; padding: 32px 24px; }
        .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .stage { height: 200px; }
      }
      @media (max-width: 560px) {
        main { padding: 28px 20px; }
        header { align-items: start; flex-direction: column; gap: 20px; margin-bottom: 24px; }
        h1 { font-size: 28px; }
        .grid { grid-template-columns: 1fr; }
        .stage { height: 210px; }
        .description { min-height: 0; }
        footer { flex-direction: column; gap: 4px; }
        button { min-height: 40px; }
      }
    </style>
  </head>
  <body data-mode="mark">
    <main>
      <header>
        <div><p class="brand">DeskBar</p><h1>图标候选</h1></div>
        <div class="controls">
          <div class="switch" role="group" aria-label="预览背景">
            <button type="button" data-theme="light" aria-pressed="true">铂银</button>
            <button type="button" data-theme="dark" aria-pressed="false">墨黑</button>
          </div>
          <div class="switch" role="group" aria-label="预览形式">
            <button type="button" data-mode="mark" aria-pressed="true">标记</button>
            <button type="button" data-mode="app" aria-pressed="false">应用图标</button>
          </div>
        </div>
      </header>
      <div class="grid" id="candidates"></div>
      <footer><span>单色 · 透明背景 SVG · 小尺寸为实际像素</span><span>已选定 03「字母 D」，其余方案保留供回看。</span></footer>
    </main>
    <script>
      const candidates = [
        { id: "01", name: "侧屏", file: "01-side-screen.svg", description: "一块主屏，一条侧栏。呼应电脑旁的工作台。", shape: '<rect x="14" y="25" width="42" height="46" rx="8" stroke="currentColor" stroke-width="8"/><rect x="68" y="21" width="18" height="54" rx="6" fill="currentColor"/>' },
        { id: "02", name: "组件", file: "02-widgets.svg", description: "三个圆角模块，表达自由组合的页面。", shape: '<g fill="currentColor"><rect x="18" y="18" width="24" height="60" rx="6"/><rect x="50" y="18" width="28" height="26" rx="6"/><rect x="50" y="52" width="28" height="26" rx="6"/></g>' },
        { id: "03", name: "字母 D", file: "03-letter-d.svg", description: "在 D 的左下留一个开口，让底边成为 Bar。", shape: '<path d="M24 18H46C65 18 78 31 78 48S65 78 46 78H24V66H46C58 66 66 59 66 48S58 30 46 30H36V54H24Z" fill="currentColor"/>' },
        { id: "04", name: "桌沿", file: "04-desk.svg", description: "一横两竖，用最少的线条勾出桌面。", shape: '<path d="M18 32H78M28 32V68M68 32V68" stroke="currentColor" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>' },
      ];
      const svg = (shape, size = 96) => `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}" viewBox="0 0 96 96" fill="none" aria-hidden="true">${shape}</svg>`;
      const arrow = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M5 17v4h14v-4"/></svg>';
      document.querySelector("#candidates").innerHTML = candidates.map(c => `
        <article aria-labelledby="name-${c.id}">
          <div class="label"><span class="number">${c.id}</span><h2 id="name-${c.id}">${c.name}</h2>${c.id === "03" ? '<span class="chosen">已选定</span>' : ""}</div>
          <div class="stage"><div class="hero">${svg(c.shape)}</div></div>
          <p class="description">${c.description}</p>
          <div class="samples">
            <div class="sizes">${[16,24,32].map(size => `<div class="size"><div class="sample-icon">${svg(c.shape, size)}</div><span>${size} px</span></div>`).join("")}</div>
            <div class="inverse" role="img" aria-label="${c.name}反色预览">${svg(c.shape)}</div>
          </div>
          <a class="download" href="icons/${c.file}" download="deskbar-${c.file}" aria-label="下载 ${c.id} ${c.name} SVG">下载 SVG ${arrow}</a>
        </article>`).join("");
      let downloadUrls = [];
      function refreshDownloads() {
        downloadUrls.forEach(url => URL.revokeObjectURL(url));
        const color = document.documentElement.dataset.theme === "dark" ? "#EEEFEF" : "#22262D";
        downloadUrls = candidates.map((c, index) => {
          const source = `<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 96 96" fill="none" role="img" aria-labelledby="title"><title id="title">DeskBar · ${c.name}</title>${c.shape.replaceAll("currentColor", color)}</svg>`;
          const url = URL.createObjectURL(new Blob([source], { type: "image/svg+xml;charset=utf-8" }));
          document.querySelectorAll(".download")[index].href = url;
          return url;
        });
      }
      document.querySelectorAll("button[data-theme]").forEach(button => button.addEventListener("click", () => {
        document.documentElement.dataset.theme = button.dataset.theme;
        document.querySelectorAll("button[data-theme]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
        refreshDownloads();
      }));
      document.querySelectorAll("button[data-mode]").forEach(button => button.addEventListener("click", () => {
        document.body.dataset.mode = button.dataset.mode;
        document.querySelectorAll("button[data-mode]").forEach(item => item.setAttribute("aria-pressed", String(item === button)));
      }));
      refreshDownloads();
    </script>
  </body>
</html>
