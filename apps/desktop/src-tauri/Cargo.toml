[package]
name = "deskbar-desktop"
version.workspace = true
edition.workspace = true

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri-plugin-single-instance = "2"
tauri-plugin-dialog = "2"
tauri = { version = "2", features = ["tray-icon"] }
deskbar-host = { path = "../../../crates/host" }
deskbar-lan = { path = "../../../crates/lan" }
tokio.workspace = true
hostname = "0.4"

serde.workspace = true
serde_json.workspace = true
open = "5"
tauri-plugin-updater = "2"
semver = "1"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSRunningApplication", "NSApplication", "NSAlert", "NSButton", "NSWindow"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSDate"] }
