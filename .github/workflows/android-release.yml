name: Android release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Decode release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.DESKBAR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64"
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/deskbar-release.keystore"
          chmod 600 "$RUNNER_TEMP/deskbar-release.keystore"

      - name: Install Flutter dependencies
        working-directory: apps/android
        run: flutter pub get

      - name: Build signed Android artifacts
        working-directory: apps/android
        env:
          DESKBAR_ANDROID_KEYSTORE_FILE: ${{ runner.temp }}/deskbar-release.keystore
          DESKBAR_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.DESKBAR_ANDROID_KEYSTORE_PASSWORD }}
          DESKBAR_ANDROID_KEY_ALIAS: ${{ secrets.DESKBAR_ANDROID_KEY_ALIAS }}
          DESKBAR_ANDROID_KEY_PASSWORD: ${{ secrets.DESKBAR_ANDROID_KEY_PASSWORD }}
        run: |
          flutter build appbundle --release
          flutter build apk --release

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: deskbar-android-${{ github.ref_name }}
          path: |
            apps/android/build/app/outputs/bundle/release/app-release.aab
            apps/android/build/app/outputs/apk/release/app-release.apk
          if-no-files-found: error
