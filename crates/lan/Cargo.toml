[package]
name = "deskbar-lan"
version.workspace = true
edition.workspace = true

[dependencies]
open = "5"
tempfile = "3"
uuid.workspace = true
deskbar-host = { path = "../host" }
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
sha2.workspace = true
base64.workspace = true
axum = { version = "0.8", features = ["ws"] }
axum-server = { version = "0.8", features = ["tls-rustls"] }
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
socket2 = { version = "0.6", features = ["all"] }
if-addrs = "0.14"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
scraper = "0.24"
image = { version = "0.25", default-features = false, features = ["png", "ico", "jpeg", "gif", "webp"] }
resvg = { version = "0.45", default-features = false }

[target.'cfg(target_os = "macos")'.dependencies]
# Legacy import only; normal desktop storage uses the private local credentials file.
keyring = { version = "3", features = ["apple-native"] }
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace", "NSImage"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSString", "NSData"] }
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }
[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["linux-native-sync-persistent", "crypto-rust"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio-tungstenite = { version = "0.29", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
